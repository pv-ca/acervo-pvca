name: Publish Acervo PVCA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 06:17 in Fortaleza (UTC-3).
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Check formatting
        run: npm run format:check
      - name: Lint source
        run: npm run lint
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Run regression tests (including mocked TMDB)
        run: npm test
      - name: Validate public catalog
        run: npm run catalog:check
      - name: Build static public site
        run: npx --no-install astro build --site "${{ steps.pages.outputs.origin || 'https://pv-ca.github.io' }}" --base "${{ steps.pages.outputs.base_path || '/acervo-pvca' }}"
      - name: Validate routes, links and assets
        run: python3 scripts/site_check.py --site "${{ steps.pages.outputs.origin || 'https://pv-ca.github.io' }}" --base "${{ steps.pages.outputs.base_path || '/acervo-pvca' }}"
      - name: Install Chromium for browser checks
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser and automated WCAG smoke checks
        run: npm run e2e
      - name: Save browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v5
